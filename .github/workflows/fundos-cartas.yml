name: Atualizar fundos das cartas (CVM)

# Roda todo dia util as 09:30 de Brasilia (12:30 UTC) e tambem pode ser
# disparado na mao pela aba Actions. Baixa o Informe Diario da CVM, recalcula
# a rentabilidade dos fundos Porto e Itau e commita fundos-cartas.json se mudou.
on:
  schedule:
    - cron: "30 12 * * 1-5"→ Runs at 12:30, Monday through Friday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recalcular fundos-cartas.json
        run: python atualizar_fundos_cartas.py

      - name: Commitar se mudou
        run: |
          git config user.name "portal-bot"
          git config user.email "portal-bot@users.noreply.github.com"
          if git diff --quiet -- fundos-cartas.json; then
            echo "Sem mudanca."
          else
            git add fundos-cartas.json
            git commit -m "Fundos das cartas: atualizacao automatica $(date -u +%Y-%m-%d)"
            git push
