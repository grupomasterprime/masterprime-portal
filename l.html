<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Master Prime</title>
<style>
*{margin:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
body{background:#0F2A4A;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.marca{font-size:12px;font-weight:800;letter-spacing:2.5px;color:#F4C24A;text-transform:uppercase;margin-bottom:10px}
h1{font-size:17px;font-weight:700}
p{font-size:13px;opacity:.7;margin-top:8px}
.spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.2);border-top-color:#F4C24A;border-radius:50%;margin:0 auto 18px;animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div>
  <div class="spin" id="spin"></div>
  <div class="marca">Master Prime</div>
  <h1 id="msg">Abrindo o link...</h1>
  <p id="sub">Você será redirecionado em instantes.</p>
</div>
<script>
(function(){
  var SUPABASE_URL = 'https://jhwciwvgagnuxakukyob.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_fy-iwSFNHKRuqP1pDokFuQ_X_UCiqzx';
  var q = new URLSearchParams(location.search);
  var c = q.get('c') || (location.search || '').replace(/^\?/, '').split('&')[0];
  function falha(){
    document.getElementById('spin').style.display = 'none';
    document.getElementById('msg').textContent = 'Link não encontrado';
    document.getElementById('sub').textContent = 'Confira o endereço ou peça um novo link para quem enviou.';
  }
  if (!c || /[^a-zA-Z0-9]/.test(c)) { falha(); return; }
  fetch(SUPABASE_URL + '/rest/v1/rpc/short_link_resolve', {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_codigo: c })
  }).then(function(r){ return r.json(); }).then(function(u){
    if (typeof u === 'string' && u.indexOf('https://grupomasterprime.github.io/') === 0) location.replace(u);
    else falha();
  }).catch(falha);
})();
</script>
</body>
</html>
