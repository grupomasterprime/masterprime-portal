<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Prime — Portal do Cliente</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ════════ Tokens dos mockups aprovados (telas t1 e t2) ════════ */
:root{
  --navy:#0F2A4A; --navy-2:#1D4E89; --navy-3:#12345E;
  --teal:#0FA3A3; --teal-2:#4FD1C5; --cta:#F4C24A;
  --bg:#F6F8FB; --card:#FFFFFF; --border:#E6EBF2; --border-2:#E2E8F0;
  --ink:#152A43; --text:#334155; --text2:#64748B; --text3:#94A3B8;
  --green:#10B981; --green-bg:#ECFDF5; --red:#DC2626; --red-bg:#FEF2F2;
  --blue:#2563EB; --blue-bg:#F0F6FF; --amber:#B45309; --amber-bg:#FFFBEB;
  --fonte:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --fonte-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--fonte)}
body{background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--teal);text-decoration:none}
button{cursor:pointer}

/* ── Hero navy com lockup MP (mockup t1/t2) ── */
.c-hero{background:linear-gradient(135deg,var(--navy),var(--navy-2));padding:26px 22px;color:#fff}
.c-hero.escuro{background:linear-gradient(135deg,var(--navy),var(--navy-3))}
.lockup{display:flex;align-items:center;gap:9px}
.lockup img{height:30px;filter:brightness(0) invert(1)}
.lockup .nm{font-size:14px;font-weight:800;letter-spacing:.4px;color:#fff}
.lockup .nm small{display:block;font-size:7.5px;font-weight:600;opacity:.8;letter-spacing:.8px}
.c-hero h1{font-size:21px;margin-top:16px;letter-spacing:-.3px;font-weight:800}
.c-hero p{font-size:13px;opacity:.85;margin-top:6px;line-height:1.5}
.c-body{padding:20px;max-width:640px;margin:0 auto}
.container{max-width:640px;margin:0 auto;padding:0 20px}
/* Desktop: conteúdo do hero limitado e alinhado com os cards (mesma coluna central) */
.c-hero-in{max-width:600px;margin:0 auto}

/* ── Cards brancos ── */
.c-card,.card{background:#fff;border-radius:16px;border:1px solid var(--border);box-shadow:0 1px 3px rgba(15,42,74,.05);margin-bottom:12px;overflow:hidden}
.c-card{padding:18px}
.card-head{padding:15px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-title{font-size:13px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px}
.card-sub{font-size:11.5px;color:var(--text2);margin-top:2px;line-height:1.45}
.card-body{padding:16px 18px}
.lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:8px}

/* ── Botões de administradora / operação (t1) ── */
.adm-btn{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid var(--border);border-radius:14px;margin-bottom:10px;background:#fff;width:100%;text-align:left;font-family:inherit;transition:all .15s}
.adm-btn:hover{border-color:var(--navy-2)}
.adm-btn.sel{border-color:var(--navy-2);background:#F0F6FF}
.adm-btn img{width:40px;height:40px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--border);padding:3px;flex-shrink:0}
.adm-btn b{font-size:14px;color:var(--ink);display:block}
.adm-btn small{display:block;font-size:11px;color:var(--text2);margin-top:2px}
.adm-btn .check{margin-left:auto;color:var(--navy-2);font-weight:800;font-size:15px}
.op{display:flex;gap:8px;margin-top:4px}
.op button{flex:1;padding:12px;border-radius:12px;border:2px solid var(--border);background:#fff;font-size:12.5px;font-weight:700;color:var(--text);font-family:inherit;transition:all .15s;line-height:1.4}
.op button:hover{border-color:var(--teal)}
.op button.sel{border-color:var(--teal);background:#ECFEFF;color:#0E7490}
.op button small{font-weight:400;font-size:10.5px;display:block;color:var(--text2)}
.op button.sel small{color:#0E7490}

/* ── Progresso de passinhos (t1) ── */
.prog-mini{display:flex;gap:6px;margin:2px 0 4px}
.prog-mini div{flex:1;height:4px;border-radius:4px;background:var(--border-2)}
.prog-mini div.on{background:var(--teal)}
.prog-passo{font-size:10.5px;color:var(--text2);margin:6px 0 14px}

/* ── Inputs ── */
.campo{margin-bottom:12px}
.campo label{display:block;font-size:10.5px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.campo .req{color:var(--red)}
.campo input,.campo textarea,.campo select,.inp{width:100%;padding:12px;border:1.5px solid var(--border-2);border-radius:10px;font-family:inherit;font-size:14px;color:var(--ink);background:#fff;outline:none;transition:border-color .15s, box-shadow .15s}
.campo input:focus,.campo textarea:focus,.campo select:focus,.inp:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,163,163,.13)}
.campo textarea{resize:vertical;min-height:64px}
.campo .hint{font-size:11px;color:var(--text3);margin-top:4px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:480px){ .grid-2{grid-template-columns:1fr;gap:0} .grid-2.manter{grid-template-columns:1fr 1fr;gap:0 10px} }

/* ── Botões ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn-primary{background:var(--navy-2);color:#fff}
.btn-primary:hover{background:var(--navy)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-outline{background:#fff;color:var(--ink);border:1.5px solid var(--border-2)}
.btn-outline:hover{border-color:var(--navy-2);color:var(--navy-2)}
.btn-teal{background:var(--teal);color:#fff}
.btn-teal:hover{background:#0B8A8A}
.btn-sm{padding:9px 14px;font-size:12px;border-radius:8px}
.w-100{width:100%}
.btn-big,.btn-cta{width:100%;padding:15px;border-radius:12px;border:0;background:var(--cta);color:var(--ink);font-size:15px;font-weight:800;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-big:hover,.btn-cta:hover{filter:brightness(.96);transform:translateY(-1px)}
.btn-big:disabled,.btn-cta:disabled{opacity:.65;cursor:not-allowed;transform:none}
.wiz-nav{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.wiz-nav .btn{width:100%;padding:14px}
.lgpd-nota{text-align:center;font-size:10.5px;color:var(--text3);margin-top:10px}

/* ── Barra de sub-passos (mantida p/ lógica do wizard) ── */
.wiz-top{margin-bottom:8px}
.wiz-passo-txt{font-size:10.5px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;margin-bottom:7px}
.wiz-bar{height:4px;border-radius:4px;background:var(--border-2);overflow:hidden}
.wiz-bar-fill{height:100%;border-radius:4px;background:var(--teal);transition:width .3s ease}
.wiz-painel{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.link-voltar{font-size:12px;color:rgba(255,255,255,.75);display:inline-flex;align-items:center;gap:5px;cursor:pointer;margin-bottom:4px}
.link-voltar.escuro{color:var(--text2)}

/* ── Alertas / tags ── */
.alerta{display:none;padding:13px 15px;border-radius:12px;font-size:13px;border:1px solid transparent;line-height:1.5;background:#fff;margin-bottom:12px}
.alerta.visivel{display:flex;align-items:flex-start;gap:10px}
.alerta-erro{background:#FFF5F5;color:#C53030;border-color:#FEB2B2}
.alerta-sucesso{background:#F0FFF4;color:#276749;border-color:#9AE6B4}
.alerta-info{background:#F0F6FF;color:#1E3A8A;border-color:#BFDBFE}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;font-size:10.5px;font-weight:700;border-radius:999px;line-height:1.3;background:#F1F5F9;color:var(--text2)}
.tag-blue{background:#DBEAFE;color:#1E40AF}
.tag-amber{background:#FEF3C7;color:#92400E}
.tag-purple{background:#EDE9FE;color:#5B21B6}
.tag-teal{background:#ECFEFF;color:#0E7490}
.tag-green{background:#DCFCE7;color:#166534}
.tag-red{background:#FEE2E2;color:#991B1B}
.aviso-consultor{display:flex;align-items:center;gap:10px;background:#ECFEFF;border:1px solid #A5F3FC;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#0E7490}

/* ── Tipo de pessoa ── */
.tipo-pessoa-selector{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tipo-pessoa-btn{padding:12px 14px;border-radius:12px;border:2px solid var(--border-2);background:#fff;cursor:pointer;transition:all .15s;text-align:center;font-family:inherit;font-size:12px;font-weight:700;color:var(--text2)}
.tipo-pessoa-btn:hover{border-color:var(--teal);color:var(--teal)}
.tipo-pessoa-btn.ativo{border-color:var(--teal);background:#ECFEFF;color:#0E7490}
.tipo-pessoa-btn .tipo-sub{font-size:10px;color:var(--text3);margin-top:2px;display:block;font-weight:500}

/* ── LGPD ── */
.checkbox-lgpd{display:flex;gap:12px;align-items:flex-start;background:#F8FAFC;padding:14px 15px;border-radius:12px;margin:14px 0;border:1px solid var(--border-2)}
.checkbox-lgpd input{margin-top:2px;width:18px;height:18px;cursor:pointer;flex-shrink:0}
.checkbox-lgpd label{font-size:11.5px;line-height:1.55;color:var(--text2);cursor:pointer}
.checkbox-lgpd strong{color:var(--navy)}

/* ── Slots de documento ── */
.doc-slots{display:flex;flex-direction:column;gap:12px}
.doc-slot{border:1.5px dashed var(--border-2);border-radius:13px;padding:14px 15px;transition:all .2s;background:#fff}
.doc-slot.preenchido{border-style:solid;border-color:var(--green);background:#F7FEF9}
.doc-slot.opcional{border-color:var(--border-2);background:#FAFBFD}
.doc-slot-head{display:flex;align-items:center;gap:12px}
.doc-slot-icon{width:38px;height:38px;border-radius:10px;flex-shrink:0;background:#F1F5F9;color:var(--text2);display:flex;align-items:center;justify-content:center}
.doc-slot.preenchido .doc-slot-icon{background:var(--green-bg);color:#047857}
.doc-slot-title{font-size:12.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.doc-slot-sub{font-size:11px;color:var(--text2);margin-top:2px}
.doc-slot input[type=file]{display:none}
.doc-slot-arquivo{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#F1F5F9;border-radius:8px;font-size:12px;margin-top:8px}
.doc-slot-arquivo .nome{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-slot-arquivo .remover{background:none;border:none;color:var(--red);cursor:pointer;font-size:13px;padding:0 4px;font-weight:700}

/* ── Acompanhamento (t2): anel + timeline ── */
.ring{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring>div{width:70px;height:70px;border-radius:50%;background:var(--navy-3);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.ring b{font-size:19px}
.ring small{font-size:8.5px;opacity:.75}
.hero-proc-lbl{font-size:10px;opacity:.7;letter-spacing:.5px;font-weight:700;text-transform:uppercase}
.hero-proc-tt{font-size:16px;font-weight:800;margin-top:3px}
.hero-proc-ola{font-size:11.5px;opacity:.8;margin-top:3px}
.tl{position:relative;padding-left:34px}
.tl:before{content:'';position:absolute;left:13px;top:8px;bottom:8px;width:2px;background:var(--border-2)}
.step{position:relative;padding:0 0 18px}
.step:last-child{padding-bottom:2px}
.step .pt{position:absolute;left:-34px;top:0;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;background:#fff;border:2px solid var(--border-2);color:var(--text3);z-index:1}
.step.done .pt{background:var(--green);border-color:var(--green);color:#fff}
.step.now .pt{background:#fff;border-color:var(--teal);color:var(--teal);box-shadow:0 0 0 5px rgba(15,163,163,.15);animation:nowPulse 1.8s ease-in-out infinite}
@keyframes nowPulse{0%,100%{box-shadow:0 0 0 4px rgba(15,163,163,.18)}50%{box-shadow:0 0 0 9px rgba(15,163,163,.05)}}
.step b{font-size:13.5px;color:var(--ink)}
.step.now b{color:#0E7490}
.step small{display:block;font-size:11px;color:var(--text3);margin-top:2px}
.step .tag-now{font-size:9.5px;font-weight:800;background:#ECFEFF;color:#0E7490;padding:2px 8px;border-radius:10px;margin-left:6px;letter-spacing:.4px;white-space:nowrap;animation:blinkNow 1.6s ease-in-out infinite}
@keyframes blinkNow{0%,100%{opacity:1}50%{opacity:.55}}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.hero-cell{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 11px}
.hero-cell .hl{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;opacity:.65;margin-bottom:2px}
.hero-cell .hv{font-size:12px;font-weight:700}

/* ── Chat (t2) ── */
.chat,.timeline{background:#F1F5F9;border-radius:14px;padding:12px;max-height:340px;overflow-y:auto;display:flex;flex-direction:column}
.msg-item{display:flex;margin-bottom:8px;max-width:85%}
.msg-item.cliente{align-self:flex-end}
.msg-avatar{display:none}
.msg-balao{padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.45}
.msg-item.admin .msg-balao{background:#fff;border:1px solid var(--border-2);color:var(--text);border-bottom-left-radius:4px}
.msg-item.cliente .msg-balao{background:#D9F5F0;color:#134E4A;border-bottom-right-radius:4px}
.msg-hora{font-size:9.5px;color:var(--text3);margin-top:4px;padding:0 2px}
.msg-input-wrap{display:flex;gap:9px;margin-top:12px}
.msg-input-wrap textarea{flex:1;padding:11px 13px;border:1.5px solid var(--border-2);border-radius:10px;font-family:inherit;font-size:13.5px;resize:none;min-height:46px;max-height:120px;outline:none}
.msg-input-wrap textarea:focus{border-color:var(--teal)}
.aviso-email-chat{font-size:10.5px;color:var(--text2);margin-top:8px;display:flex;gap:6px;align-items:flex-start;line-height:1.5}

/* ── PDF card azul (t2) ── */
.pdf-card{display:flex;gap:12px;align-items:center;background:#F0F6FF;border:1px solid #BFDBFE;border-radius:14px;padding:14px;margin-bottom:12px;text-decoration:none}
.pdf-ico{width:42px;height:42px;border-radius:10px;background:var(--navy-2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
.pdf-card .pdf-tt{font-size:13px;font-weight:800;color:#1E3A8A}
.pdf-card .pdf-sub{font-size:11px;color:#475569;margin-top:1px}
.pdf-card .pdf-cta{margin-left:auto;font-weight:800;color:var(--navy-2);font-size:11px;white-space:nowrap}

/* ── Arquivos ── */
.arquivo-item{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:10px;border:1px solid var(--border);margin-bottom:8px;background:#fff;font-size:12.5px;cursor:pointer}
.arquivo-item:hover{border-color:var(--teal)}
.arquivo-item .file-ico{width:32px;height:32px;border-radius:8px;flex-shrink:0;background:#F0F6FF;color:var(--navy-2);display:flex;align-items:center;justify-content:center}
.arquivo-item .file-info{flex:1;min-width:0}
.arquivo-item .file-name{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arquivo-item .file-meta{font-size:10.5px;color:var(--text2);margin-top:1px}

/* ── Lista de processos por CPF ── */
.proc-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:12px;border:1px solid var(--border);background:#fff;cursor:pointer;transition:all .15s;text-decoration:none;color:inherit}
.proc-row+.proc-row{margin-top:8px}
.proc-row:hover{border-color:var(--teal);background:#F8FCFD}
.proc-info{flex:1;min-width:0}
.proc-name{font-weight:700;font-size:13px;color:var(--ink);margin-bottom:2px}
.proc-meta{font-size:11px;color:var(--text2);display:flex;flex-wrap:wrap;gap:5px}
.proc-meta .mono{font-family:var(--fonte-mono);font-weight:700;color:var(--ink)}

/* ── Sucesso ── */
.start-card{background:#fff;border-radius:16px;border:1px solid var(--border);box-shadow:0 8px 24px rgba(15,42,74,.10);overflow:hidden}
.start-head{padding:28px 22px 20px;text-align:center;border-bottom:1px solid var(--border)}
.start-head .badge-icon{width:56px;height:56px;border-radius:15px;margin:0 auto 14px;background:linear-gradient(135deg,var(--teal),var(--teal-2));display:flex;align-items:center;justify-content:center;color:#fff}
.start-head h1{font-size:19px;font-weight:800;color:var(--navy);margin-bottom:6px;letter-spacing:-.2px}
.start-head p{font-size:12.5px;color:var(--text2)}
.start-body{padding:20px 22px 24px}
.start-divider{display:flex;align-items:center;gap:14px;margin:20px 0 12px;color:var(--text3);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.start-divider::before,.start-divider::after{content:"";flex:1;height:1px;background:var(--border)}
.sucesso-box{background:var(--green-bg);border:1.5px solid #86EFAC;border-radius:13px;padding:16px 18px;margin-bottom:16px}

/* ── Diversos ── */
.ico{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:currentColor}
.ico svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico-lg{width:24px;height:24px}
.empty{padding:24px 16px;text-align:center;color:var(--text3);font-size:12.5px}
.spinner{width:15px;height:15px;border:2px solid var(--border-2);border-top-color:var(--teal);border-radius:50%;display:inline-block;animation:spin .8s linear infinite}
.spinner-dark{border-color:var(--border-2);border-top-color:var(--navy)}
.spinner-lg{width:34px;height:34px;border-width:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.notif{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 22px;border-radius:999px;font-size:12.5px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:999;display:flex;align-items:center;gap:8px;animation:fadeUp .3s ease;max-width:92vw}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}}
#loading-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}

/* ── Pop-up de aviso/erro (estilo formulário de adesão) ── */
.pop-overlay{position:fixed;inset:0;background:rgba(15,42,74,.55);z-index:1200;display:none;align-items:center;justify-content:center;padding:24px;animation:popFade .18s ease}
.pop-overlay.aberto{display:flex}
.pop-card{background:#fff;border-radius:16px;max-width:400px;width:100%;box-shadow:0 24px 60px rgba(15,42,74,.35);overflow:hidden;animation:popUp .22s ease}
.pop-head{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:800;letter-spacing:.2px}
.pop-head svg{width:18px;height:18px;stroke:var(--cta);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.pop-body{padding:18px;font-size:13.5px;color:var(--text);line-height:1.6}
.pop-foot{padding:0 18px 18px}
.pop-btn{width:100%;padding:13px;border-radius:12px;border:0;background:var(--cta);color:var(--ink);font-size:14px;font-weight:800;font-family:inherit;transition:filter .15s}
.pop-btn:hover{filter:brightness(.96)}
@keyframes popFade{from{opacity:0}to{opacity:1}}
@keyframes popUp{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}

// ════════════════════════════════════════════════════════════════
// CALENDÁRIO DE DIAS ÚTEIS (SP) — fins de semana + feriados
// nacionais, estadual SP (9/7) e municipais da capital (25/1, 20/11)
// ════════════════════════════════════════════════════════════════
function _p2(n){ return String(n).padStart(2,'0'); }
function dataPascoa(ano){
  const a=ano%19, b=Math.floor(ano/100), c=ano%100, d=Math.floor(b/4), e=b%4,
        f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30,
        i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
        mes=Math.floor((h+l-7*m+114)/31), dia=((h+l-7*m+114)%31)+1;
  return new Date(Date.UTC(ano, mes-1, dia));
}
const _feriadosCache = {};
function feriadosSP(ano){
  if (_feriadosCache[ano]) return _feriadosCache[ano];
  const f = new Set();
  [[1,1],[4,21],[5,1],[9,7],[10,12],[11,2],[11,15],[12,25],[7,9],[1,25],[11,20]]
    .forEach(md => f.add(ano + '-' + _p2(md[0]) + '-' + _p2(md[1])));
  const pascoa = dataPascoa(ano);
  [-48,-47,-2,60].forEach(off => {           // Carnaval seg+ter, Sexta Santa, Corpus Christi
    const d = new Date(pascoa.getTime() + off*86400000);
    f.add(d.getUTCFullYear() + '-' + _p2(d.getUTCMonth()+1) + '-' + _p2(d.getUTCDate()));
  });
  _feriadosCache[ano] = f;
  return f;
}
function _soData(x){
  if (x instanceof Date) return new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const s = String(x);
  if (s.includes('T')) { const d = new Date(s); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  const p = s.slice(0,10).split('-').map(Number);
  return new Date(p[0], p[1]-1, p[2]);
}
function isDiaUtil(d){
  const dow = d.getDay();
  if (dow === 0 || dow === 6) return false;
  const iso = d.getFullYear() + '-' + _p2(d.getMonth()+1) + '-' + _p2(d.getDate());
  return !feriadosSP(d.getFullYear()).has(iso);
}
function diasUteisEntre(ini, fim){
  let a = _soData(ini), b = _soData(fim);
  if (!a || !b || b <= a) return 0;
  let n = 0; const d = new Date(a);
  while (d < b) { d.setDate(d.getDate()+1); if (isDiaUtil(d)) n++; }
  return n;
}

// ── Helpers do catálogo (mesmos nas duas páginas) ──
function normAdmin(s){
  s = String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if (s.includes('porto')) return 'porto';
  if (s.includes('itau')) return 'itau';
  if (s.includes('bradesco')) return 'bradesco';
  return s;
}
function catalogoJornada(admin, operacao){
  const a = normAdmin(admin), o = String(operacao||'faturamento');
  return PROCESSOS_CATALOGO.find(c => c.admin === a && c.operacao === o) || null;
}
function montarEtapasIniciais(admin, operacao){
  const cat = catalogoJornada(admin, operacao);
  if (!cat) return null;
  const agora = new Date().toISOString();
  const etapas = cat.etapas.map(e => ({
    k: e.k, nome: e.nome,
    done_em: e.pre ? agora : null,
    obs: e.pre ? 'Concluída na abertura do processo' : null
  }));
  const atual = etapas.findIndex(e => !e.done_em);
  return { etapas, etapa_atual: atual < 0 ? etapas.length - 1 : atual };
}
function parseDE(de){
  if (!de) return {};
  if (typeof de === 'string') { try { return JSON.parse(de); } catch(e){ return {}; } }
  return de;
}
// Lê a jornada de um processo: coluna etapas → fallback dados_extras.jornada_v2 → null (legado)
function jornadaDoProcesso(p){
  let et = p.etapas, atual = p.etapa_atual;
  if (typeof et === 'string') { try { et = JSON.parse(et); } catch(e){ et = null; } }
  if (!Array.isArray(et) || !et.length) {
    const de = parseDE(p.dados_extras);
    const j = de.jornada_v2;
    if (j && Array.isArray(j.etapas) && j.etapas.length) { et = j.etapas; if (atual == null) atual = j.etapa_atual; }
  }
  if (!Array.isArray(et) || !et.length) return null;
  if (atual == null || atual < 0 || atual >= et.length) {
    atual = et.findIndex(e => !e.done_em);
    if (atual < 0) atual = et.length - 1;
  }
  return { etapas: et, atual };
}

async function consultarProcesso(){
  const raw = (document.getElementById('cpf-consulta').value || '').replace(/\D/g,'');
  if (raw.length < 11){ alerta('alerta-consulta','Informe um CPF (11 dígitos) ou CNPJ (14 dígitos) válido.','erro'); return; }
  const { data, error } = await sb.rpc('cliente_listar_por_cpf', { p_cpf: raw });
  if (error){ alerta('alerta-consulta','Não conseguimos buscar agora. Tente novamente em instantes.','erro'); return; }
  if (!data || !data.length){ alerta('alerta-consulta','Não encontramos nenhum processo para este CPF/CNPJ. Confira o número digitado ou inicie um novo processo.','erro'); return; }
  if (data.length === 1){ window.location.href = '?t=' + encodeURIComponent(data[0].token); return; }
  document.getElementById('lista-processos-cpf').innerHTML = `
    <div class="c-card">
      <div class="lbl">Seus processos (${data.length}) — toque para acompanhar</div>
      <div>
        ${data.map(p => `
          <a class="proc-row" href="?t=${encodeURIComponent(p.token)}">
            <div class="proc-info">
              <div class="proc-name">${esc(p.nome)}</div>
              <div class="proc-meta">
                ${p.protocolo ? `<span class="mono">${esc(p.protocolo)}</span>` : `<span style="color:var(--amber);font-weight:700">Protocolo pendente</span>`}
                ${p.grupo ? `<span>· Grupo ${esc(p.grupo)}</span>` : ''}
                ${p.cota ? `<span>· Cota ${esc(p.cota)}</span>` : ''}
              </div>
            </div>
            <span class="tag ${tagClass(p.status)}">${esc(p.status)}</span>
          </a>`).join('')}
      </div>
    </div>`;
}

function blocoLgpdEnvio(){
  return `
    <div class="checkbox-lgpd">
      <input type="checkbox" id="autorizacao-lgpd">
      <label for="autorizacao-lgpd">
        <strong>Autorização de uso de dados (LGPD)</strong><br>
        Autorizo a <strong>Master Prime</strong> a utilizar meus dados pessoais fornecidos neste formulário para fins de análise de crédito, processamento do consórcio, comunicação sobre o andamento do processo e demais finalidades relacionadas, conforme a Lei Geral de Proteção de Dados (Lei nº 13.709/2018). Declaro que li e concordo com os termos.
      </label>
    </div>`;
}

function atualizarSubPasso(){
  document.querySelectorAll('.wiz-painel').forEach(p => {
    p.style.display = Number(p.dataset.sub) === wiz.sub ? '' : 'none';
  });
  const prog = document.getElementById('wiz-prog-dados');
  if (prog) prog.innerHTML = wizTopo(3 + wiz.sub, wizTotalPassos(), wiz.subPassos[wiz.sub] || 'Dados');
  const btnAv = document.getElementById('wiz-btn-avancar');
  const ultimo = wiz.sub === wiz.subTotal - 1;
  if (btnAv) btnAv.innerHTML = ultimo ? 'Enviar processo &#8594;' : 'Continuar &#8594;';
  const btnVo = document.getElementById('wiz-btn-voltar');
  if (btnVo) btnVo.style.display = wiz.sub === 0 ? 'none' : '';
  if (ultimo) {
    renderSlotsAnexo();
    preencherRevisaoTransfer();
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function wizSubAnterior(){ if (wiz.sub > 0){ wiz.sub--; atualizarSubPasso(); } }
function wizSubProxima(){
  const erro = validarSubPasso(wiz.sub);
  if (erro){ alerta('alerta-cadastro', erro, 'erro'); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if (wiz.sub < wiz.subTotal - 1){ wiz.sub++; atualizarSubPasso(); }
  else enviarCadastro();
}

function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function valNum(id){ return (val(id) || '').replace(/\D/g,''); }

function validarSubPasso(sub){
  const a = wiz.admin, op = wiz.op;
  const transferSimples = (op === 'transferencia' && (a.id === 'itau' || a.id === 'bradesco'));
  if (op === 'transferencia') {
    if (sub === 0) {
      const doc = wiz.tipoPessoa === 'pj' ? valNum('f-cedente-cnpj') : valNum('f-cedente-cpf');
      if (!val('f-cedente-nome')) return 'Informe o nome do cedente.';
      if (doc.length < 11) return 'Informe o CPF/CNPJ do cedente.';
      if (!val('f-cedente-grupo') || !val('f-cedente-cota')) return 'Informe grupo e cota do cedente.';
      return null;
    }
    if (sub === 1) {
      if (!val('f-cessionario-nome')) return 'Informe o nome do cessionário.';
      if (valNum('f-cessionario-cpf').length < 11) return 'Informe o CPF/CNPJ do cessionário.';
      if (transferSimples) {
        if (!val('f-cessionario-nascimento')) return 'Informe a data de nascimento do cessionário.';
        if (!val('f-cessionario-sexo')) return 'Informe o sexo do cessionário.';
        if (!val('f-cessionario-mae')) return 'Informe o nome da mãe do cessionário.';
        if (!val('f-cessionario-doc-tipo') || !val('f-cessionario-doc')) return 'Informe o documento de identificação do cessionário (tipo e número).';
        if (!val('f-cessionario-email') || !val('f-cessionario-telefone')) return 'Informe e-mail e celular do cessionário.';
      } else {
        if (!val('f-cessionario-grupo') || !val('f-cessionario-cota')) return 'Informe grupo e cota do cessionário.';
      }
      const ec = val('f-estado_civil');
      if ((ec === 'casado' || ec === 'uniao_estavel') && (!val('f-conjuge-nome') || valNum('f-conjuge-cpf').length !== 11))
        return 'Preencha nome e CPF do cônjuge corretamente.';
      return null;
    }
    if (transferSimples && sub === 2) {
      if (!val('f-cessionario-logradouro') || !val('f-cessionario-numero') || !val('f-cessionario-bairro') || !val('f-cessionario-cidade') || !val('f-cessionario-uf'))
        return 'Preencha o endereço completo do cessionário (logradouro, número, bairro, cidade e UF).';
      if (!val('f-cessionario-profissao')) return 'Informe a profissão do cessionário.';
      if (!obterValorReal('f-cessionario-renda')) return 'Informe a renda mensal do cessionário.';
      return null;
    }
    return null; // último passo valida tudo no envio
  }
  if (a.id === 'bradesco') {
    if (sub === 0) {
      const doc = wiz.tipoPessoa === 'pj' ? valNum('f-cnpj') : valNum('f-cpf');
      if (!val('f-nome')) return 'Informe o nome completo.';
      if (doc.length < 11) return 'Informe um CPF/CNPJ válido.';
      return null;
    }
    if (sub === 2) {
      const linha = document.querySelector('.grupo-cota-linha');
      if (!linha || !linha.querySelector('.f-grupo').value.trim() || !linha.querySelector('.f-cota').value.trim())
        return 'Preencha ao menos um grupo e uma cota.';
      if (!obterValorReal('f-valor_venda')) return 'Informe o valor de venda do veículo.';
      return null;
    }
    return null;
  }
  // porto/itau faturamento
  if (sub === 0) {
    const doc = wiz.tipoPessoa === 'pj' ? valNum('f-cnpj') : valNum('f-cpf');
    if (!val('f-nome')) return 'Informe o nome completo.';
    if (doc.length < 11) return 'Informe um CPF/CNPJ válido.';
    if (!val('f-grupo') || !val('f-cota')) return 'Informe grupo e cota.';
    const ec = val('f-estado_civil');
    if ((ec === 'casado' || ec === 'uniao_estavel') && (!val('f-conjuge-nome') || valNum('f-conjuge-cpf').length !== 11))
      return 'Preencha nome e CPF do cônjuge corretamente.';
    return null;
  }
  if (sub === 1) {
    const cond = val('f-condicao-bem');
    if (!cond) return 'Informe se o bem é novo ou usado.';
    if (cond === 'novo' && (!val('f-modelo') || !val('f-versao') || !val('f-cor-veiculo') || !val('f-ano-modfab')))
      return 'Preencha todos os campos do veículo novo.';
    if (!obterValorReal('f-valor_venda')) return 'Informe o valor de venda do bem.';
    return null;
  }
  if (sub === 2) {
    if (!val('f-vendedor-banco') || !val('f-vendedor-conta')) return 'Preencha pelo menos banco e conta do vendedor.';
    if (a.id === 'itau' && wiz.tipoPessoa === 'pj') {
      if (!val('f-rep-nome') || valNum('f-rep-cpf').length !== 11 || !val('f-rep-email'))
        return 'Preencha todos os dados do representante legal (Itaú PJ).';
    }
    return null;
  }
  return null;
}

// ── Autofill: CPF + data de nascimento → buscar_proposta_anterior ──
const _autofillFeito = {};
async function tentarAutofill(cpfId, dataId, alvo){
  try {
    const doc = valNum(cpfId);
    const dataIso = val(dataId);
    if (doc.length !== 11 || !dataIso || _autofillFeito[alvo]) return;
    const { data, error } = await sb.rpc('buscar_proposta_anterior', { p_doc: doc, p_data: dataIso, p_tipo: 'pf' });
    if (error || !data) return;
    _autofillFeito[alvo] = true;
    const setSeVazio = (id, v) => {
      const el = document.getElementById(id);
      if (el && !el.value.trim() && v) { el.value = v; el.dispatchEvent(new Event('input',{bubbles:true})); }
    };
    const tel = data.telefone || data.celular || '';
    const endereco = data.endereco || [data.logradouro, data.numero, data.bairro, data.cidade && (data.cidade + (data.uf ? ' - ' + data.uf : ''))].filter(Boolean).join(', ');
    if (alvo === 'titular') {
      setSeVazio('f-nome', data.nome);
      setSeVazio('f-email', data.email);
      setSeVazio('f-telefone', tel);
      setSeVazio('f-endereco', endereco);
    } else if (alvo === 'cedente') {
      setSeVazio('f-cedente-nome', data.nome);
      setSeVazio('f-cedente-email', data.email);
      setSeVazio('f-cedente-telefone', tel);
    } else {
      setSeVazio('f-cessionario-nome', data.nome);
      setSeVazio('f-cessionario-email', data.email);
      setSeVazio('f-cessionario-telefone', tel);
      setSeVazio('f-cessionario-endereco', endereco);
      setSeVazio('f-cessionario-cep', data.cep);
      setSeVazio('f-cessionario-profissao', data.profissao || data.cargo);
      if (data.cidade) setSeVazio('f-cessionario-cidade', data.cidade + (data.uf ? ' - ' + data.uf : ''));
    }
    const aviso = document.getElementById('aviso-autofill-' + alvo);
    if (aviso) aviso.innerHTML = `
      <div style="background:#F0FDF4;border-left:3px solid var(--green);padding:11px 14px;border-radius:8px;margin-bottom:13px;font-size:12.5px;color:#166534">
        <strong>Encontramos um cadastro anterior seu.</strong> Alguns campos foram pré-preenchidos — confira e ajuste o que precisar.
      </div>`;
  } catch(e) { /* autofill nunca bloqueia o formulário */ }
}

// ── Busca de CEP (viacep, best-effort) para o endereço do cessionário ──
async function buscarCepCessionario(){
  const cep = valNum('f-cessionario-cep');
  if (cep.length !== 8) return;
  try {
    const r = await fetch('https://viacep.com.br/ws/' + cep + '/json/');
    const d = await r.json();
    if (!d || d.erro) return;
    const setSeVazio = (id, v) => { const el = document.getElementById(id); if (el && !el.value.trim() && v) el.value = v; };
    setSeVazio('f-cessionario-logradouro', d.logradouro);
    setSeVazio('f-cessionario-bairro', d.bairro);
    setSeVazio('f-cessionario-cidade', d.localidade);
    setSeVazio('f-cessionario-uf', d.uf);
  } catch(e) { /* nunca bloqueia o formulário */ }
}

// ── Slots de anexo (drag & drop igual ao cliente atual) ──
function renderSlotsAnexo(){
  const slots = document.getElementById('doc-slots');
  if (!slots) return;
  const documentos = docsDoFluxo();
  if (!documentos){ slots.innerHTML = ''; return; }
  let crlvObrigatorio = false;
  const selCond = document.getElementById('f-condicao-bem');
  if (wiz.op === 'faturamento' && selCond && selCond.value === 'usado') crlvObrigatorio = true;

  slots.innerHTML = documentos.map(cat => {
    const arq = arquivosPendentes[cat.key];
    const isCRLV = cat.key === 'crlv' || cat.key === 'Doc.CRLV';
    const obrig = cat.obrigatorio || (isCRLV && crlvObrigatorio);
    return `
      <div class="doc-slot ${arq?'preenchido':''} ${!obrig?'opcional':''}" data-cat="${cat.key}">
        <div class="doc-slot-head">
          <div class="doc-slot-icon">${ico(cat.iconKey,'ico ico-lg')}</div>
          <div style="flex:1;min-width:0">
            <div class="doc-slot-title">${esc(cat.label)}
              ${obrig ? '<span class="tag tag-red" style="font-size:9px">Obrigatório</span>' : '<span class="tag" style="font-size:9px">Opcional</span>'}
            </div>
            <div class="doc-slot-sub">${esc(cat.sub)}</div>
          </div>
          <div>
            <input type="file" id="f-file-${cat.key}" accept=".pdf,.jpg,.jpeg,.png" onchange="setArquivoSlot('${cat.key}', this)">
            <button class="btn btn-outline btn-sm" type="button" onclick="document.getElementById('f-file-${cat.key}').click()">${arq?'Trocar':'Selecionar'}</button>
          </div>
        </div>
        ${arq?`<div class="doc-slot-arquivo">${ico('doc')} <span class="nome">${esc(arq.name)}</span> <span style="color:var(--text3);font-size:11px">${(arq.size/1024).toFixed(0)} KB</span> <button class="remover" onclick="removerArquivoSlot('${cat.key}')" title="Remover">&#10005;</button></div>`:''}
      </div>`;
  }).join('');

  documentos.forEach(cat => {
    const el = document.querySelector('.doc-slot[data-cat="' + cat.key + '"]');
    if (!el) return;
    el.addEventListener('dragover', e => { e.preventDefault(); el.style.borderColor = 'var(--mp-teal)'; });
    el.addEventListener('dragleave', () => { el.style.borderColor = ''; });
    el.addEventListener('drop', e => {
      e.preventDefault(); el.style.borderColor = '';
      if (e.dataTransfer.files.length){
        const inp = document.getElementById('f-file-' + cat.key);
        if (inp){ inp.files = e.dataTransfer.files; setArquivoSlot(cat.key, inp); }
      }
    });
  });
}
function setArquivoSlot(catKey, input){
  const f = input.files && input.files[0];
  if (!f) return;
  if (f.size > 16*1024*1024){ alerta('alerta-cadastro', '"' + f.name + '" passa de 16MB.', 'erro'); return; }
  arquivosPendentes[catKey] = f;
  renderSlotsAnexo();
}
function removerArquivoSlot(catKey){
  delete arquivosPendentes[catKey];
  renderSlotsAnexo();
}

// ════════════════════════════════════════════════════════════════
// ENVIO DO CADASTRO — mesma RPC cliente_criar_processo do atual
// ════════════════════════════════════════════════════════════════
async function enviarCadastro(){
  const a = wiz.admin, op = wiz.op;
  if (!a || !op){ alerta('alerta-cadastro','Selecione administradora e tipo de operação.','erro'); return; }
  if (!document.getElementById('autorizacao-lgpd')?.checked){
    alerta('alerta-cadastro','Você precisa autorizar o uso dos seus dados conforme a LGPD para prosseguir.','erro');
    return;
  }
  const transferSimples = (op === 'transferencia' && (a.id === 'itau' || a.id === 'bradesco'));
  const estadoCivil = val('f-estado_civil');
  const conjugeNome = val('f-conjuge-nome') || null;
  const conjugeCpf = valNum('f-conjuge-cpf') || null;

  let nome, cpf, grupo, cota, email, tel, corretor = null, descricao = null;
  let dadosExtras = { banco: a.id, tipo_operacao: op, tipo_pessoa: wiz.tipoPessoa };

  if (op === 'transferencia') {
    const cedDoc = wiz.tipoPessoa === 'pj' ? valNum('f-cedente-cnpj') : valNum('f-cedente-cpf');
    const cedente = {
      nome: val('f-cedente-nome'), cpf: cedDoc, tipo_pessoa: wiz.tipoPessoa,
      grupo: val('f-cedente-grupo'), cota: val('f-cedente-cota'),
      email: val('f-cedente-email') || null, telefone: val('f-cedente-telefone') || null, data_nascimento: (typeof val==='function' && val('f-cedente-nascimento')) || null };
    const cessionario = {
      nome: val('f-cessionario-nome'), cpf: valNum('f-cessionario-cpf'),
      grupo: transferSimples ? cedente.grupo : val('f-cessionario-grupo'),
      cota: transferSimples ? cedente.cota : val('f-cessionario-cota'),
      email: val('f-cessionario-email') || null, telefone: val('f-cessionario-telefone') || null,
      endereco: val('f-cessionario-endereco') || null,
      estado_civil: estadoCivil, conjuge: { nome: conjugeNome, cpf: conjugeCpf }
    };
    if (transferSimples) {
      // dados pessoais completos (estilo adesão)
      cessionario.data_nascimento = val('f-cessionario-nascimento') || null;
      cessionario.sexo = val('f-cessionario-sexo') || null;
      cessionario.nacionalidade = val('f-cessionario-nacionalidade') || null;
      cessionario.uf_naturalidade = val('f-cessionario-uf-natal') || null;
      cessionario.cidade_natal = val('f-cessionario-cidade-natal') || null;
      cessionario.nome_mae = val('f-cessionario-mae') || null;
      cessionario.nome_pai = val('f-cessionario-pai') || null;
      // documento
      cessionario.documento_tipo = val('f-cessionario-doc-tipo') || null;
      cessionario.documento = val('f-cessionario-doc') || null;
      cessionario.documento_emissao = val('f-cessionario-doc-emissao') || null;
      cessionario.documento_orgao = val('f-cessionario-doc-orgao') || null;
      // endereço completo
      cessionario.cep = val('f-cessionario-cep') || null;
      cessionario.logradouro = val('f-cessionario-logradouro') || null;
      cessionario.numero = val('f-cessionario-numero') || null;
      cessionario.complemento = val('f-cessionario-complemento') || null;
      cessionario.bairro = val('f-cessionario-bairro') || null;
      cessionario.cidade = val('f-cessionario-cidade') || null;
      cessionario.uf = val('f-cessionario-uf') || null;
      cessionario.endereco = [cessionario.logradouro, cessionario.numero, cessionario.complemento, cessionario.bairro].filter(Boolean).join(', ') || null;
      // profissão e renda
      cessionario.profissao = val('f-cessionario-profissao') || null;
      cessionario.empresa = val('f-cessionario-empresa') || null;
      cessionario.data_admissao = val('f-cessionario-admissao') || null;
      cessionario.renda = obterValorReal('f-cessionario-renda') || null;
    } else {
      cessionario.data_nascimento = val('f-cessionario-nascimento') || null;
    }
    if (!cedente.nome || cedDoc.length < 11 || !cedente.grupo || !cedente.cota)
      return alerta('alerta-cadastro','Preencha todos os campos obrigatórios do cedente.','erro');
    if (!cessionario.nome || cessionario.cpf.length < 11)
      return alerta('alerta-cadastro','Preencha todos os campos obrigatórios do cessionário.','erro');
    nome = cessionario.nome; cpf = cessionario.cpf; grupo = cessionario.grupo; cota = cessionario.cota;
    email = cessionario.email; tel = cessionario.telefone;
    Object.assign(dadosExtras, { estado_civil: estadoCivil, conjuge: { nome: conjugeNome, cpf: conjugeCpf }, cedente, cessionario });
  }
  else if (a.id === 'bradesco') {
    nome = val('f-nome');
    cpf = wiz.tipoPessoa === 'pj' ? valNum('f-cnpj') : valNum('f-cpf');
    if (!nome) return alerta('alerta-cadastro','Nome é obrigatório.','erro');
    if (cpf.length < 11) return alerta('alerta-cadastro','CPF/CNPJ inválido.','erro');
    email = val('f-email') || null; tel = val('f-telefone') || null;
    const linhas = document.querySelectorAll('.grupo-cota-linha');
    const gruposCotas = [];
    linhas.forEach(l => {
      const g = l.querySelector('.f-grupo')?.value.trim();
      const c = l.querySelector('.f-cota')?.value.trim();
      if (g && c) gruposCotas.push({ grupo: g, cota: c });
    });
    if (!gruposCotas.length) return alerta('alerta-cadastro','Preencha ao menos um grupo e uma cota.','erro');
    grupo = gruposCotas[0].grupo; cota = gruposCotas[0].cota;
    if (!arquivosPendentes['documento_foto']) return alerta('alerta-cadastro','Anexe o documento com foto do consorciado.','erro');
    if (!arquivosPendentes['comprovante_residencia']) return alerta('alerta-cadastro','Anexe o comprovante de residência.','erro');
    if (!arquivosPendentes['comprovante_renda']) return alerta('alerta-cadastro','Anexe o comprovante de renda.','erro');
    if (!arquivosPendentes['documento_foto_vendedor']) return alerta('alerta-cadastro','Anexe o documento com foto do vendedor.','erro');
    Object.assign(dadosExtras, {
      estado_civil: estadoCivil, conjuge: { nome: conjugeNome, cpf: conjugeCpf },
      consorciado: {
        nome, cpf, tipo_pessoa: wiz.tipoPessoa, data_nasc: val('f-data_nasc'), estado_civil: estadoCivil,
        doc_id: val('f-doc_id'), tipo_doc: val('f-tipo_doc'), data_expedicao: val('f-data_expedicao'),
        orgao_emissor: val('f-orgao_emissor'), renda: obterValorReal('f-renda'),
        cargo: val('f-cargo'), nacionalidade: val('f-nacionalidade'), estado_naturalidade: val('f-estado_naturalidade'),
        celular: tel, email, endereco: val('f-endereco')
      },
      dados_bancarios: {
        nome: val('f-banco-nome') || nome, banco: val('f-banco'), agencia: val('f-agencia'),
        conta: val('f-conta'), digito: val('f-conta_digito') || null, tipo_conta: val('f-tipo_conta')
      },
      grupos_cotas: gruposCotas,
      veiculo: {
        chassi: val('f-chassi'), placa: val('f-placa'), renavam: val('f-renavam'), uf_lic: val('f-uf_lic'),
        marca: val('f-marca'), modelo: val('f-modelo'), cor: val('f-cor_veiculo'),
        ano_fab: val('f-ano_fab'), ano_modelo: val('f-ano_fab'), valor_venda: obterValorReal('f-valor_venda')
      },
      vendedor: {
        nome: val('f-vend-nome'), cpf: valNum('f-vend-cpf'), endereco: val('f-vend-endereco'),
        banco: val('f-vend-banco'), agencia: val('f-vend-agencia'), conta: val('f-vend-conta'),
        tipo_conta: val('f-vend-tipo_conta'), pix: val('f-vend-pix'),
        email: val('f-vend-email'), telefone: val('f-vend-telefone')
      }
    });
  }
  else {
    nome = val('f-nome');
    cpf = wiz.tipoPessoa === 'pj' ? valNum('f-cnpj') : valNum('f-cpf');
    grupo = val('f-grupo'); cota = val('f-cota');
    email = val('f-email') || null; tel = val('f-telefone') || null;
    corretor = val('f-corretor') || null;
    descricao = val('f-descricao') || null;
    if (!nome) return alerta('alerta-cadastro','Nome é obrigatório.','erro');
    if (cpf.length < 11) return alerta('alerta-cadastro','CPF/CNPJ inválido.','erro');
    if (!grupo || !cota) return alerta('alerta-cadastro','Grupo e cota são obrigatórios.','erro');
    const cond = val('f-condicao-bem');
    if (cond === 'usado') {
      const crlvKey = a.id === 'itau' ? 'crlv' : 'Doc.CRLV';
      if (!arquivosPendentes[crlvKey]) return alerta('alerta-cadastro','Para bem usado, o CRLV do bem é obrigatório.','erro');
    }
    Object.assign(dadosExtras, {
      estado_civil: estadoCivil, conjuge: { nome: conjugeNome, cpf: conjugeCpf },
      representante_legal: { nome: val('f-rep-nome') || null, cpf: valNum('f-rep-cpf') || null, email: val('f-rep-email') || null },
      data_nascimento: val('f-data_nasc') || null,
      endereco: val('f-endereco') || null,
      condicao_bem: cond,
      modelo: val('f-modelo'), versao: val('f-versao'),
      cor_veiculo: val('f-cor-veiculo'), ano_modfab: val('f-ano-modfab'),
      valor_venda: obterValorReal('f-valor_venda'),
      corretor, descricao,
      vendedor: {
        nome: val('f-vendedor-nome'), cpf: valNum('f-vendedor-cpf'), endereco: val('f-vendedor-endereco'),
        banco: val('f-vendedor-banco'), agencia: val('f-vendedor-agencia'), conta: val('f-vendedor-conta'),
        digito: val('f-vendedor-digito') || null, tipo_conta: val('f-vendedor-tipo_conta'),
        pix: val('f-vendedor-pix'), email: val('f-vendedor-email'), telefone: val('f-vendedor-telefone')
      }
    });
  }

  // documentos obrigatórios do checklist
  const documentos = docsDoFluxo() || [];
  for (const cat of documentos){
    if (cat.obrigatorio && !arquivosPendentes[cat.key])
      return alerta('alerta-cadastro','Anexo obrigatório: ' + cat.label + '.','erro');
  }

  // código do consultor (?c=CODIGO): processo nasce atribuído, igual à adesão
  if (CODIGO_CONSULTOR) {
    dadosExtras.codigo_link = CODIGO_CONSULTOR;
    if (!corretor) corretor = CODIGO_CONSULTOR;
  }

  // jornada v2: etapas do catálogo, com as "pre" já concluídas
  const jor = montarEtapasIniciais(a.id, op);
  if (jor) dadosExtras.jornada_v2 = { administradora: a.nomeOficial, operacao: op, etapas: jor.etapas, etapa_atual: jor.etapa_atual };

  const tokenGerado = gerarTokenSeguro();
  const btn = document.getElementById('wiz-btn-avancar');
  if (btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Enviando...'; }

  try {
    const { data: criado, error: errC } = await sb.rpc('cliente_criar_processo', {
      p_nome: nome,
      p_cpf: cpf,
      p_email: email,
      p_telefone: tel,
      p_grupo: grupo,
      p_cota: cota,
      p_corretor: corretor,
      p_descricao: descricao || null,
      p_dados_extras: dadosExtras,
      p_token: tokenGerado
    });
    if (errC) throw new Error(errC.message);
    const novoT = (criado && criado.token) || tokenGerado;

    // grava as colunas novas (best-effort; se a RPC v2 ainda não existir, o
    // fallback dados_extras.jornada_v2 garante que nada quebra)
    if (jor) {
      try {
        await sb.rpc('cliente_v2_definir_jornada', {
          p_token: novoT,
          p_administradora: a.nomeOficial,
          p_operacao: op,
          p_etapas: jor.etapas,
          p_etapa_atual: jor.etapa_atual
        });
      } catch(e) { /* silencioso */ }
    }

    // link do consultor (?c=CODIGO): resolve codigo_link em portal_users e
    // grava consultor_id/consultor_nome (RPC aditiva SECURITY DEFINER, best-effort)
    if (CODIGO_CONSULTOR) {
      try {
        await sb.rpc('cliente_v2_atribuir_consultor', { p_token: novoT, p_codigo: CODIGO_CONSULTOR });
      } catch(e) { /* best-effort: nunca bloqueia a abertura */ }
    }

    for (const cat of documentos){
      const f = arquivosPendentes[cat.key];
      if (!f) continue;
      const path = novoT + '/' + cat.key + '_' + Date.now() + '_' + f.name;
      const { error: errUp } = await sb.storage.from('arquivos').upload(path, f);
      if (errUp){ console.warn('Upload falhou:', cat.key, errUp.message); continue; }
      await sb.rpc('cliente_registrar_arquivo', {
        p_token: novoT,
        p_nome_original: f.name,
        p_storage_path: path,
        p_categoria: cat.key
      });
    }

    arquivosPendentes = {};
    clienteNotificar(novoT, 'Novo processo recebido', nome);   // sininho da equipe; e-mail NÃO é enviado na abertura
    renderTelaSucesso(novoT, cpf);
  } catch(e){
    alerta('alerta-cadastro','Não conseguimos enviar agora: ' + e.message, 'erro');
    if (btn){ btn.disabled = false; btn.innerHTML = 'Enviar processo ' + ico('arrow'); }
  }
}

function copiarLink(link){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link).then(() => mostrarNotif('Link copiado!'));
  } else {
    const el = document.createElement('textarea');
    el.value = link; document.body.appendChild(el); el.select();
    document.execCommand('copy'); document.body.removeChild(el);
    mostrarNotif('Link copiado!');
  }
}

function adminDoProcesso(p){
  const de = parseDE(p.dados_extras);
  const id = normAdmin(de.banco || p.administradora || '');
  return ADMINS.find(a => a.id === id) || { id:'', nome:'Administradora', logo:null, cor:'#2D3F5E', corDark:'#1E2D45' };
}
function operacaoDoProcesso(p){
  const de = parseDE(p.dados_extras);
  return p.operacao || de.tipo_operacao || (de.jornada_v2 && de.jornada_v2.operacao) || 'faturamento';
}
function jornadaParaExibir(p){
  const j = jornadaDoProcesso(p);
  if (j) return { legado:false, etapas: j.etapas, atual: (p.status === 'Finalizado') ? j.etapas.length : j.atual };
  // LEGADO: jornada genérica mapeada do status — nunca quebra
  let idx = JORNADA_LEGADA.findIndex(e => e.status === p.status);
  if (idx < 0) idx = 0;
  const etapas = JORNADA_LEGADA.map((e, i) => ({
    k: 'legado_' + i, nome: e.nome,
    done_em: i < idx ? (p.atualizado_em || p.criado_em) : (i === idx && p.status === 'Finalizado' ? (p.atualizado_em || p.criado_em) : null),
    obs: null
  }));
  return { legado:true, etapas, atual: p.status === 'Finalizado' ? etapas.length : idx };
}

async function enviarNovosDocumentos(){
  const input = document.getElementById('novos-docs-input');
  const files = input && input.files;
  if (!files || !files.length){ alerta('alerta-upload-doc','Selecione pelo menos um arquivo.','erro'); return; }
  const descricao = val('nova-doc-desc') || 'Documento complementar';
  const btn = document.getElementById('btn-upload-docs');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Enviando...';
  try {
    const { data: proc, error: procErr } = await sb.from('portal_processos').select('id').eq('token', processoAtual.token).single();
    if (procErr || !proc) throw new Error('Processo não encontrado.');
    let ok = 0;
    for (const file of files){
      if (file.size > 16*1024*1024){ mostrarNotif('Arquivo ' + file.name + ' excede 16MB, ignorado.','erro'); continue; }
      const safe = file.name.replace(/[^a-zA-Z0-9.\-]/g,'_');
      const path = processoAtual.token + '/complementar_' + Date.now() + '_' + safe;
      const { error: upErr } = await sb.storage.from('arquivos').upload(path, file);
      if (upErr) continue;
      const { error: insErr } = await sb.from('portal_arquivos').insert({
        processo_id: proc.id, nome_original: file.name, storage_path: path,
        categoria: 'complementar', descricao
      });
      if (insErr){ await sb.storage.from('arquivos').remove([path]); continue; }
      ok++;
    }
    if (ok > 0){
      mostrarNotif(ok + ' arquivo(s) enviado(s) com sucesso!');
      input.value = '';
      const d = document.getElementById('nova-doc-desc'); if (d) d.value = '';
      await carregarDocumentos();
      clienteNotificar(processoAtual.token, 'Novo documento enviado pelo cliente', processoAtual.nome);
    } else {
      alerta('alerta-upload-doc','Nenhum arquivo pôde ser enviado. Tente novamente.','erro');
    }
  } catch(e){
    alerta('alerta-upload-doc','Erro ao enviar: ' + e.message,'erro');
  } finally {
    btn.disabled = false; btn.innerHTML = ico('upload') + ' Enviar arquivo(s)';
  }
}

async function carregarDocumentos(){
  const container = document.getElementById('lista-arquivos');
  if (!container) return;
  let data, error;
  try {
    const r = await sb.rpc('cliente_listar_arquivos', { p_token: processoAtual.token });
    data = r.data; error = r.error;
    if (error){
      const { data: proc } = await sb.from('portal_processos').select('id').eq('token', processoAtual.token).single();
      if (proc){
        const fb = await sb.from('portal_arquivos').select('*').eq('processo_id', proc.id).order('criado_em');
        data = fb.data; error = fb.error;
      }
    }
  } catch(e){ error = e; }
  if (error){ container.innerHTML = '<div class="empty">Não foi possível carregar os documentos agora.</div>'; return; }
  if (!data || !data.length){ container.innerHTML = '<div class="empty">Nenhum documento enviado ainda.</div>'; return; }
  container.innerHTML = data.map(arq => {
    const url = sb.storage.from('arquivos').getPublicUrl(arq.storage_path).data.publicUrl;
    let catLabel = arq.categoria || '';
    if (catLabel === 'complementar') catLabel = arq.descricao || 'Complementar';
    return `
      <div class="arquivo-item" onclick="window.open('${url}','_blank')">
        <div class="file-ico">${ico('doc')}</div>
        <div class="file-info">
          <div class="file-name">${esc(arq.nome_original)}</div>
          <div class="file-meta">${esc(catLabel)} · ${fmtData(arq.criado_em)}</div>
        </div>
        <span style="font-size:10px;color:var(--mp-teal);font-weight:700">Abrir</span>
      </div>`;
  }).join('');
}

    return `
      <div class="msg-item ${lado}">
        <div class="msg-avatar">${lado === 'cliente' ? 'V' : 'MP'}</div>
        <div>
          <div class="msg-balao">${esc(m.texto)}</div>
          <div class="msg-hora">${lado === 'admin' ? 'Equipe Master Prime · ' : ''}${fmtData(m.criado_em)}</div>
        </div>
      </div>`;
  }).join('');
  timeline.scrollTop = timeline.scrollHeight;
}

async function enviarMensagem(){
  const textarea = document.getElementById('nova-msg');
  const txt = textarea && textarea.value.trim();
  if (!txt || !processoAtual) return;
  const btn = document.getElementById('btn-enviar-msg');
  if (btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  textarea.disabled = true;
  let error = null;
  try {
    const r = await sb.rpc('cliente_enviar_mensagem', { p_token: processoAtual.token, p_texto: txt, p_autor: 'cliente' });
    error = r.error;
    if (error){
      const { data: proc, error: ep } = await sb.from('portal_processos').select('id').eq('token', processoAtual.token).single();
      if (!ep && proc){
        const ins = await sb.from('portal_mensagens').insert({ processo_id: proc.id, autor: 'cliente', texto: txt });
        error = ins.error;
      }
    }
  } catch(e){ error = e; }
  if (btn){ btn.disabled = false; btn.innerHTML = ico('send'); }
  textarea.disabled = false;
  if (error){ mostrarNotif('Erro ao enviar mensagem.','erro'); return; }
  textarea.value = '';
  clienteNotificar(processoAtual.token, 'Nova mensagem do cliente', processoAtual.nome || '');
  await carregarMensagens();
}

function iniciarPolling(){
  pararPolling();
  _pollingInterval = setInterval(async () => {
    if (!processoAtual) return;
    const { data } = await sb.rpc('cliente_obter_por_token', { p_token: processoAtual.token });
    if (data && (data.status !== processoAtual.status || JSON.stringify(data.etapas||null) !== JSON.stringify(processoAtual.etapas||null))){
      processoAtual = data;
      renderAcompanhamento();
    } else {
      await carregarMensagens();
    }
  }, 30000);
}
function pararPolling(){ if (_pollingInterval){ clearInterval(_pollingInterval); _pollingInterval = null; } }

function abrirTab(id){
  document.querySelectorAll('.painel').forEach(p => p.classList.remove('ativo'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('ativa'));
  const painel = document.getElementById(id);
  if (painel) painel.classList.add('ativo');
  const map = { 'painel-jornada':'tab-jornada', 'painel-msg':'tab-msg', 'painel-docs':'tab-docs' };
  const tab = document.getElementById(map[id]);
  if (tab) tab.classList.add('ativa');
}

// ════════════════════════════════════════════════════════════════
// UTILITÁRIOS
// ════════════════════════════════════════════════════════════════
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtData(d){
  if (!d) return '';
  return new Date(d).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function fmtDataCurta(d){
  if (!d) return '';
  return new Date(d).toLocaleDateString('pt-BR');
}
function formatarCpfCnpj(v){
  if (!v) return '-';
  const n = String(v).replace(/\D/g,'');
  if (n.length === 11) return n.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
  if (n.length === 14) return n.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  return v;
}
function tagClass(s){
  const map = {
    'Recebido':'tag-blue','Em análise':'tag-amber','Enviado para administradora':'tag-teal',
    'Em retorno da administradora':'tag-purple','Finalizado':'tag-green','Cancelado':'tag-red'
  };
  return map[s] || 'tag';
}
function mascaraCPF(el){
  let v = el.value.replace(/\D/g,'').substring(0,11);
  v = v.replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1-$2');
  el.value = v;
}
function mascaraCNPJ(el){
  let v = el.value.replace(/\D/g,'').substring(0,14);
  v = v.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2');
  el.value = v;
}
function mascaraCpfCnpj(el){
  let raw = el.value.replace(/\D/g,'');
  if (raw.length <= 11){
    raw = raw.substring(0,11).replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1-$2');
  } else {
    raw = raw.substring(0,14).replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2');
  }
  el.value = raw;
}
function mascaraTel(el){
  let v = el.value.replace(/\D/g,'').substring(0,11);
  if (v.length > 2) v = '(' + v.substring(0,2) + ') ' + v.substring(2);
  if (v.length > 10) v = v.substring(0,10) + '-' + v.substring(10);
  el.value = v;
}
function mascaraCEP(el){
  let v = el.value.replace(/\D/g,'').substring(0,8);
  if (v.length > 5) v = v.substring(0,5) + '-' + v.substring(5);
  el.value = v;
}
function mascaraValor(el){
  let v = el.value.replace(/\D/g,'');
  v = (parseInt(v,10) || 0).toString();
  const reais = v.slice(0,-2).replace(/\B(?=(\d{3})+(?!\d))/g,'.') || '0';
  const cent = v.slice(-2).padStart(2,'0');
  el.value = 'R$ ' + reais + ',' + cent;
}
// ── Pop-up de aviso/erro (estilo do formulário de adesão) ──
// Toda mensagem dinâmica de erro/aviso abre este modal centralizado;
// nada de box inline vermelho.
function popAlerta(msg, titulo){
  let ov = document.getElementById('pop-alerta');
  if (!ov){
    ov = document.createElement('div');
    ov.id = 'pop-alerta';
    ov.className = 'pop-overlay';
    ov.innerHTML = `
      <div class="pop-card" role="alertdialog" aria-modal="true" aria-labelledby="pop-alerta-titulo">
        <div class="pop-head">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span id="pop-alerta-titulo">Atenção</span>
        </div>
        <div class="pop-body" id="pop-alerta-msg"></div>
        <div class="pop-foot"><button type="button" class="pop-btn" onclick="fecharPopAlerta()">Entendi</button></div>
      </div>`;
    ov.addEventListener('click', function(e){ if (e.target === ov) fecharPopAlerta(); });
    document.body.appendChild(ov);
  }
  document.getElementById('pop-alerta-titulo').textContent = titulo || 'Atenção';
  document.getElementById('pop-alerta-msg').innerHTML = msg;
  ov.classList.add('aberto');
  const btn = ov.querySelector('.pop-btn');
  if (btn) setTimeout(() => btn.focus(), 60);
}
function fecharPopAlerta(){
  const ov = document.getElementById('pop-alerta');
  if (ov) ov.classList.remove('aberto');
}
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') fecharPopAlerta(); });
// Assinatura preservada (id mantido por compatibilidade; a mensagem vira pop-up).
function alerta(id, msg, tipo){
  popAlerta(msg, tipo === 'erro' ? 'Atenção' : (tipo === 'sucesso' ? 'Tudo certo' : 'Aviso'));
}
